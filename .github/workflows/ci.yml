name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm i

      - name: Check generated registry types
        run: |
          pnpm generate:types
          if ! git diff --exit-code -- packages/script/src/registry-types.json; then
            echo "::error file=packages/script/src/registry-types.json::The generated registry types are out of date. Run \`pnpm generate:types\` and commit the result."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm i

      - name: Dev prepare
        run: pnpm dev:prepare

      - name: Typecheck
        run: pnpm typecheck

      - name: Test attw
        run: pnpm run --if-present test:attw

  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm i

      - name: Dev prepare
        run: pnpm dev:prepare

      - name: Build
        run: pnpm build

  test:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm i

      - name: Dev prepare
        run: pnpm dev:prepare

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-arm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright-core install chromium
        continue-on-error: true

      - name: Prepare fixtures
        run: pnpm run --if-present prepare:fixtures

      - name: Run tests
        run: |
          pnpm vitest run --project typecheck --project unit --project nuxt-runtime
          for test_file in test/e2e/*.test.ts; do
            pnpm vitest run --project e2e "$test_file"
          done

  packed-consumer:
    runs-on: ubuntu-24.04-arm
    name: Packed Nuxt ${{ matrix.nuxt }} on Node ${{ matrix.node }} (future ${{ matrix.future }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {nuxt: 4.6.0, node: 22.22.3, future: false, panel: false, base: /}
          - {nuxt: 4.6.0, node: 22.22.3, future: true, panel: false, base: /}
          - {nuxt: 4.6.0, node: 24.15.0, future: false, panel: false, base: /, edge: true}
          - {nuxt: 4.6.0, node: 24.15.0, future: true, panel: true, base: /sub/}
          - {nuxt: 5.0.0-2610061032-c7ad8cd, node: 24.15.0, future: false, panel: true, base: /}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dev:prepare
      - run: pnpm build
      - name: Verify isolated packed consumer
        run: node test/packed/verify.ts --nuxt ${{ matrix.nuxt }} --base ${{ matrix.base }} ${{ matrix.future && '--future' || '' }} ${{ matrix.panel && '--devtools' || '' }} ${{ matrix.edge && '--edge' || '' }}
      - name: Verify optional panel boundaries
        if: matrix.edge
        run: |
          node test/packed/verify.ts --devtools --devtools-disabled
          node test/packed/verify.ts --mismatched-devtools
      - name: Upload consumer evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: packed-${{ matrix.nuxt }}-${{ matrix.node }}-${{ matrix.future }}
          path: |
            ${{ runner.temp }}/nuxt-scripts-packed-*/verification.log
            ${{ runner.temp }}/nuxt-scripts-packed-*/dependencies.json
            ${{ runner.temp }}/nuxt-scripts-packed-*/devtools-tab.json
