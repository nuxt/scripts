minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@types/jest-image-snapshot@6.4.2'

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 262800

trustPolicyExclude:
  - tinyexec@1.2.2

shellEmulator: true

packages:
  - packages/*
  - playground
  - '!examples/**'

overrides:
  '@nuxt/scripts': 'workspace:*'
  '@unhead/bundler@>=3': 3.4.2
  '@unhead/vue@>=3': 3.4.2
  unhead@>=3: 3.4.2
  vitest-environment-nuxt: 2.0.0

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  protobufjs: true
  vue-demi: true
  workerd: true

